name: Emulator acceptance
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  acceptance:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
          cache-dependency-path: tests/java/pom.xml
      - run: go test -race ./...
      # ANTLR-generated parser has unreachable branches; all other vet checks stay enabled.
      - run: go vet -unreachable=false ./...
      - run: docker build --platform linux/amd64 -t maxcompute-emulator:ci .
      - run: mvn -B -f tests/java/pom.xml -Demulator.image=maxcompute-emulator:ci test
