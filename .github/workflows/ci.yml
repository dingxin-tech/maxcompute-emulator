name: Emulator acceptance
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  acceptance:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
          cache-dependency-path: tests/java/pom.xml
      - name: Go validation in Linux container
        run: |
          docker build --platform linux/amd64 --target build -t emulator-build .
          docker run --rm emulator-build sh -c 'go test -race ./... && go vet -unreachable=false ./...'
      - run: docker build --platform linux/amd64 -t maxcompute-emulator:ci .
      - run: mvn -B -f tests/java/pom.xml -Demulator.image=maxcompute-emulator:ci test
      - name: Set up Python for the PyODPS consumer probe
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: PyODPS resource/function contract probe
        run: |
          pip install -r tests/python/requirements.txt
          docker run -d --name emulator-pyodps -p 127.0.0.1:8099:8080 maxcompute-emulator:ci
          trap 'docker logs emulator-pyodps; docker rm -f emulator-pyodps' EXIT
          for _ in $(seq 1 30); do curl -s -o /dev/null http://127.0.0.1:8099/ && break; sleep 1; done
          python -u tests/python/run.py http://127.0.0.1:8099 test_project
      - name: C++ Arrow contract and fault tests
        run: |
          docker build -t emulator-cpp-contract tests/cpp
          docker run -d --name emulator-cpp maxcompute-emulator:ci --listen 0.0.0.0:8080 --test-mode --test-network
          trap 'docker logs emulator-cpp; docker rm -f emulator-cpp' EXIT
          docker run --rm --network container:emulator-cpp emulator-cpp-contract http://127.0.0.1:8080 --faults
