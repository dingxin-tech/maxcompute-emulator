name: Release Docker image
on:
  push:
    tags: ['v[0-9]*']
permissions:
  contents: write
concurrency:
  group: emulator-release
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      IMAGE: maxcompute/maxcompute-emulator
    steps:
      - uses: actions/checkout@v4
      - name: Validate stable version
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          grep -F "const Version = \"$version\"" internal/server/server.go
          echo "VERSION=$version" >> "$GITHUB_ENV"
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
          cache-dependency-path: tests/java/pom.xml
      - name: Go validation
        run: |
          go test -race ./...
          go vet -unreachable=false ./...
      - name: Build Linux source image
        run: docker build --platform linux/amd64 --label org.opencontainers.image.revision="$GITHUB_SHA" -t "$IMAGE:$VERSION" .
      - name: SDK acceptance before publication
        run: mvn -B -f tests/java/pom.xml -Demulator.image="$IMAGE:$VERSION" test
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_HUB_USER_NAME }}
          password: ${{ secrets.DOCKER_HUB_PASSWORD }}
      - name: Publish version and verify remote pull
        run: |
          docker push "$IMAGE:$VERSION"
          docker image rm "$IMAGE:$VERSION"
          docker pull --platform linux/amd64 "$IMAGE:$VERSION"
          docker image inspect "$IMAGE:$VERSION" --format '{{json .RepoDigests}}'
          mvn -B -f tests/java/pom.xml -Demulator.image="$IMAGE:$VERSION" test
      - name: Update latest after acceptance
        run: |
          docker tag "$IMAGE:$VERSION" "$IMAGE:latest"
          docker push "$IMAGE:latest"
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --verify-tag --title "MaxCompute Emulator $VERSION" --notes-file docs/release-notes.md
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: java-acceptance
          path: tests/java/target/surefire-reports/
